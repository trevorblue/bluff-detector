# DVC pipeline for the M0 variant. `dvc repro` reruns only stages whose inputs changed;
# `dvc push` stores data and artefacts by content hash. Copy the block per variant.
vars:
  - config: configs/variants/m0_base.yaml
  - vid: m0_base

stages:
  ingest:
    cmd: bluff ingest --config ${config}
    deps: [src/bluff/pipeline/ingest.py, data/kenya/questions.jsonl, configs/base.yaml]
    outs: [data/processed/questions.jsonl, data/processed/manifest.json]
  generate:
    cmd: bluff generate --config ${config}
    deps: [src/bluff/pipeline/generate.py, src/bluff/backends.py, data/processed/questions.jsonl]
    outs: ["data/interim/${vid}/generations.jsonl", "data/interim/${vid}/hidden.npz"]
  label:
    cmd: bluff label --config ${config}
    deps: [src/bluff/pipeline/label.py, src/bluff/matching.py, "data/interim/${vid}/generations.jsonl"]
    outs: ["data/interim/${vid}/labels.jsonl"]
  featurize:
    cmd: bluff featurize --config ${config}
    deps: [src/bluff/signals.py, "data/interim/${vid}/labels.jsonl", "data/interim/${vid}/hidden.npz"]
    outs: ["data/processed/${vid}"]
  train:
    cmd: bluff train --config ${config}
    deps: [src/bluff/detectors.py, src/bluff/pipeline/train.py, "data/processed/${vid}"]
    outs: ["artefacts/${vid}"]
  evaluate:
    cmd: bluff evaluate --config ${config}
    deps: [src/bluff/metrics.py, src/bluff/pipeline/evaluate.py, "artefacts/${vid}"]
    metrics:
      - reports/${vid}/metrics.json:
          cache: false
