# Repairs to the students' questions, made by an AI review (Claude), 19 November 2026.
#
# Trevor decided, given the deadline, to have the gaps the students left repaired with AI help
# instead of waiting for the students. Everything here is applied by `bluff clean-sheets` and
# logged row by row (data/kenya/cleaned/changes.csv). Provenance stays visible in the data:
# every new row has Author = "Claude (AI)", and every edited row has Reviewer = "Claude (AI)",
# so the results can be reported with and without AI-written items. Declared in AI_USE.md.
#
# Per student (A-D, as in student_files.yaml):
#   drop: rows left out, with the reason          match: words from the student's question
#   edit: changed cells (set), with the reason    (as they wrote it; must match exactly one row)
#   twin: a UK twin of a kept Kenya question, with its answer and an official UK source
#   add:  a new question (here: fake questions replacing D's fakes about other countries)

