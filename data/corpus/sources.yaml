# The Kenyan document collections: which public documents go where.
#
# `bluff build-corpus` downloads every source below and writes
#   retrieval_chunks.jsonl  passages of ~300-800 tokens   (M1 RAG, M3)
#   finetune_docs.jsonl     whole documents               (M2 QLoRA, M3)
# A document goes to exactly one collection (`collection:`), never both (data/README.md).
# Domains match the student question sheet. Edit this list and re-run to change the corpus.
#
# kind: wikisource = a page of the Constitution on en.wikisource.org (public legal text)
#       wikipedia  = an English Wikipedia article (CC BY-SA 4.0; attribution in every line)

constitution:
  kind: wikisource
  collection: retrieval
  domain: civics_law
  prefix: "Constitution of Kenya (2010)/"
  parts: [Preamble, Chapter 1, Chapter 2, Chapter 3, Chapter 4, Chapter 5, Chapter 6, Chapter 7,
          Chapter 8, Chapter 9, Chapter 10, Chapter 11, Chapter 12, Chapter 13, Chapter 14,
          Chapter 15, Chapter 16, Chapter 17, Chapter 18, First Schedule, Second Schedule,
          Third Schedule, Fourth Schedule, Fifth Schedule, Sixth Schedule]

wikipedia:
  # --- civics and law
  - {title: Kenya, domain: civics_law, collection: retrieval}
  - {title: Politics of Kenya, domain: civics_law, collection: retrieval}
  - {title: Counties of Kenya, domain: civics_law, collection: retrieval}
  - {title: Parliament of Kenya, domain: civics_law, collection: retrieval}
  - {title: President of Kenya, domain: civics_law, collection: retrieval}
  - {title: Judiciary of Kenya, domain: civics_law, collection: retrieval}
  - {title: Elections in Kenya, domain: civics_law, collection: retrieval}
  - {title: Independent Electoral and Boundaries Commission, domain: civics_law, collection: retrieval}
  - {title: Constitution of Kenya, domain: civics_law, collection: finetune}
  - {title: Senate of Kenya, domain: civics_law, collection: finetune}
  - {title: National Assembly (Kenya), domain: civics_law, collection: finetune}
