<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
  <title id="t">Bluff Detector</title>
  <desc id="d">A model answers "Kenya has 52 counties" fluently, but the token for 52 has low probability and its hidden state lights up an uncertainty direction. The probe scores P(wrong) at 0.81, above the 0.25 threshold, so the gate abstains. Kenya has 47 counties.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-reduced-motion: reduce) { .anim { display: none; } }
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.045"/>
    </pattern>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#79C0FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#79C0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F85149" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F85149" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meter" x1="0" x2="1">
      <stop offset="0" stop-color="#E3B341"/>
      <stop offset="1" stop-color="#F85149"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="460" rx="18"/></clipPath>
    <clipPath id="stripClip"><rect x="726" y="304" width="463" height="32"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="460" fill="#0A0E14"/>
    <rect width="1280" height="460" fill="url(#dots)"/>
    <ellipse cx="960" cy="230" rx="520" ry="300" fill="url(#glowBlue)"/>
    <ellipse cx="897" cy="196" rx="190" ry="120" fill="url(#glowRed)"/>

    <!-- left: title block -->
    <g transform="translate(72 0)">
      <rect x="0" y="104" width="10" height="10" rx="2" fill="#000000" stroke="#FFFFFF" stroke-opacity="0.7"/>
      <rect x="14" y="104" width="10" height="10" rx="2" fill="#BB0000"/>
      <rect x="28" y="104" width="10" height="10" rx="2" fill="#006600" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="52" y="114" class="mono" font-size="13" letter-spacing="2.4" fill="#8B98A8">HIDDEN-STATE PROBES · ABSTENTION · MLOPS</text>
      <text x="-4" y="198" class="sans" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#E6EDF3">Bluff Detector</text>
      <text x="0" y="252" class="sans" font-size="29" font-weight="500" fill="#C9D1D9">Do language models know</text>
      <text x="0" y="290" class="sans" font-size="29" font-weight="500" fill="#C9D1D9">they <tspan fill="#F85149">don’t know</tspan> Kenya?</text>
      <text x="0" y="338" class="sans" font-size="16.5" fill="#8B98A8">Catch the bluff in the model’s hidden states, measure the</text>
      <text x="0" y="362" class="sans" font-size="16.5" fill="#8B98A8">gap between knowing and saying, and gate every answer.</text>
      <g class="mono" font-size="12.5">
        <rect x="0" y="388" width="78" height="26" rx="13" fill="none" stroke="#2A3644"/>
        <text x="39" y="405" text-anchor="middle" fill="#8B98A8">M0 base</text>
        <rect x="88" y="388" width="84" height="26" rx="13" fill="none" stroke="#2A3644"/>
        <text x="130" y="405" text-anchor="middle" fill="#8B98A8">M1 +RAG</text>
        <rect x="182" y="388" width="100" height="26" rx="13" fill="none" stroke="#2A3644"/>
        <text x="232" y="405" text-anchor="middle" fill="#8B98A8">M2 +QLoRA</text>
        <rect x="292" y="388" width="84" height="26" rx="13" fill="none" stroke="#2A3644"/>
        <text x="334" y="405" text-anchor="middle" fill="#8B98A8">M3 both</text>
      </g>
    </g>

    <!-- right: one question, read from the inside -->
    <rect x="700" y="64" width="520" height="352" rx="16" fill="#10161F" fill-opacity="0.92" stroke="#1F2935"/>
    <circle cx="726" cy="90" r="4.5" fill="#FF5F57"/><circle cx="742" cy="90" r="4.5" fill="#FEBC2E"/><circle cx="758" cy="90" r="4.5" fill="#28C840"/>
    <text x="1196" y="94" text-anchor="end" class="mono" font-size="11.5" fill="#5B6878">POST /v1/ask</text>

    <text x="726" y="128" class="mono" font-size="11" letter-spacing="1.6" fill="#5B6878">QUESTION</text>
    <text x="726" y="153" class="sans" font-size="18" fill="#E6EDF3">How many counties does Kenya have?</text>

    <text x="726" y="190" class="mono" font-size="11" letter-spacing="1.6" fill="#5B6878">ANSWER · TOKEN PROBABILITY</text>
    <rect x="726" y="198" width="74" height="36" rx="7" fill="#161E29" stroke="#2A3644" stroke-width="1.5"></rect><text x="763.0" y="222" text-anchor="middle" class="mono" font-size="16" fill="#E6EDF3" font-weight="500">Kenya</text><rect x="726" y="244" width="74" height="4" rx="2" fill="#1C2531"/><rect x="726" y="244" width="71.8" height="4" rx="2" fill="#3FB950"/><text x="726" y="264" class="mono" font-size="11" fill="#5B6878">p 0.97</text><rect x="810" y="198" width="55" height="36" rx="7" fill="#161E29" stroke="#2A3644" stroke-width="1.5"></rect><text x="837.5" y="222" text-anchor="middle" class="mono" font-size="16" fill="#E6EDF3" font-weight="500">has</text><rect x="810" y="244" width="55" height="4" rx="2" fill="#1C2531"/><rect x="810" y="244" width="52.2" height="4" rx="2" fill="#3FB950"/><text x="810" y="264" class="mono" font-size="11" fill="#5B6878">p 0.95</text><rect x="875" y="198" width="45" height="36" rx="7" fill="rgba(248,81,73,0.10)" stroke="#F85149" stroke-width="1.5"><animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></rect><text x="897.5" y="222" text-anchor="middle" class="mono" font-size="16" fill="#F85149" font-weight="600">52</text><rect x="875" y="244" width="45" height="4" rx="2" fill="#1C2531"/><rect x="875" y="244" width="13.9" height="4" rx="2" fill="#F85149"/><text x="875" y="264" class="mono" font-size="11" fill="#F85149">p 0.31</text><rect x="930" y="198" width="104" height="36" rx="7" fill="#161E29" stroke="#2A3644" stroke-width="1.5"></rect><text x="982.0" y="222" text-anchor="middle" class="mono" font-size="16" fill="#E6EDF3" font-weight="500">counties</text><rect x="930" y="244" width="104" height="4" rx="2" fill="#1C2531"/><rect x="930" y="244" width="93.6" height="4" rx="2" fill="#3FB950"/><text x="930" y="264" class="mono" font-size="11" fill="#5B6878">p 0.90</text>
    <text x="1056" y="214" class="mono" font-size="11" letter-spacing="1.2" fill="#5B6878">TRUTH</text>
    <text x="1056" y="232" class="mono" font-size="16" font-weight="600" fill="#3FB950">47</text>

    <text x="726" y="296" class="mono" font-size="11" letter-spacing="1.6" fill="#5B6878">HIDDEN STATE · LAYER −8 · LAST ANSWER TOKEN</text>
    <rect x="726" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.13"/><rect x="741" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.22"/><rect x="756" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.53"/><rect x="771" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.18"/><rect x="786" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.49"/><rect x="801" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.40"/><rect x="816" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.28"/><rect x="831" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.24"/><rect x="846" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.30"/><rect x="861" y="308" width="13" height="24" rx="2.5" fill="#F85149" fill-opacity="0.70"/><rect x="876" y="308" width="13" height="24" rx="2.5" fill="#F85149" fill-opacity="0.90"/><rect x="891" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.27"/><rect x="906" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.22"/><rect x="921" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.42"/><rect x="936" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.12"/><rect x="951" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.22"/><rect x="966" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.10"/><rect x="981" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.47"/><rect x="996" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.22"/><rect x="1011" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.42"/><rect x="1026" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.43"/><rect x="1041" y="308" width="13" height="24" rx="2.5" fill="#F85149" fill-opacity="0.60"/><rect x="1056" y="308" width="13" height="24" rx="2.5" fill="#F85149" fill-opacity="0.56"/><rect x="1071" y="308" width="13" height="24" rx="2.5" fill="#F85149" fill-opacity="0.79"/><rect x="1086" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.13"/><rect x="1101" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.13"/><rect x="1116" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.28"/><rect x="1131" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.23"/><rect x="1146" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.54"/><rect x="1161" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.31"/><rect x="1176" y="308" width="13" height="24" rx="2.5" fill="#79C0FF" fill-opacity="0.24"/>
    <g clip-path="url(#stripClip)" class="anim">
      <rect x="666" y="304" width="60" height="32" fill="url(#scan)">
        <animate attributeName="x" values="666;1189" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="726" y="360" class="mono" font-size="11" letter-spacing="1.6" fill="#5B6878">PROBE · P(WRONG)</text>
    <rect x="726" y="372" width="300" height="9" rx="4.5" fill="#1C2531"/>
    <rect x="726" y="372" width="243" height="9" rx="4.5" fill="url(#meter)">
      <animate attributeName="width" values="0;243" keyTimes="0;1" dur="1.6s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
    </rect>
    <line x1="801" x2="801" y1="367" y2="386" stroke="#E3B341" stroke-width="2"/>
    <text x="801" y="402" text-anchor="middle" class="mono" font-size="11" fill="#E3B341">threshold 0.25</text>
    <text x="1040" y="382" class="mono" font-size="18" font-weight="700" fill="#F85149">0.81</text>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="1.7s" fill="freeze"/>
      <rect x="1094" y="361" width="104" height="32" rx="16" fill="rgba(248,81,73,0.14)" stroke="#F85149" stroke-width="1.5"/>
      <text x="1146" y="382" text-anchor="middle" class="mono" font-size="13" font-weight="700" letter-spacing="1.5" fill="#F85149">ABSTAIN</text>
    </g>
  </g>
</svg>
