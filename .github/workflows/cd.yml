# CD: on merge to main, build the image, scan it, and push it tagged with version + SHA.
name: cd
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bluff-detector:0.1.0-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      # TODO: replace with `fetch the @champion artefact` once a real variant is trained.
      - run: bluff all --config configs/variants/dev_fake.yaml
      - run: docker build -t "$IMAGE" .
      - name: Vulnerability scan (fails on CRITICAL)
        # Pinned by commit SHA: this action's tags were rewritten in a 2026 supply-chain attack.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE"
